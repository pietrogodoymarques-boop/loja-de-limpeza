<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lojas de Limpeza</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#06301f;--bg2:#0a4a30;--card:#0d5a3a;--line:#1c7a52;--txt:#e9f5ee;--orange:#ff9d00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:60px}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'Open Sans',Arial,sans-serif;color-scheme:dark}
nav{position:sticky;top:0;z-index:5;background:#031d12;border-bottom:3px solid var(--orange);display:flex;flex-wrap:wrap;justify-content:center;gap:6px 28px;padding:14px 12px}
nav a{color:var(--txt);text-decoration:none;font-weight:600;text-transform:capitalize;padding:4px 2px;border-bottom:2px solid transparent;cursor:pointer}
nav a:hover{color:var(--orange);border-color:var(--orange)}
header{text-align:center;padding:64px 16px 56px;background:linear-gradient(var(--bg2),var(--bg))}
h1{font-family:'Minecrafter','Press Start 2P',monospace;color:#ffa51a;font-size:clamp(1.6rem,6vw,3.6rem);margin:0;text-shadow:0 0 12px #ff9d00,0 0 28px #ff7a00;font-weight:400;letter-spacing:2px}
header p{margin:20px 0 0;color:#b9dccb}
section.cat{max-width:1100px;margin:0 auto;padding:56px 16px 20px}
section.cat h2{font-size:1.6rem;margin:0 0 20px;padding-bottom:10px;border-bottom:2px solid var(--line);text-transform:capitalize}
section.cat h2 span{color:var(--orange)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}
.prod{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;text-align:center}
.prod svg{display:block;width:100%;height:190px;background:#e8f3ec}
.prod h3{font-size:1rem;margin:12px 10px 4px}
.prod .pr{color:var(--orange);font-weight:600;margin-bottom:14px}
.cad{max-width:560px;margin:60px auto 0;padding:40px 16px 70px}
.cad h2{font-size:1.6rem;margin:0 0 6px}
.cad p{color:#b9dccb;margin:0 0 20px}
label{display:block;font-weight:600;margin:14px 0 6px}
input{width:100%;padding:12px;border-radius:6px;border:1px solid var(--line);background:#031d12;color:var(--txt);font:inherit}
input:focus{outline:2px solid var(--orange)}
button{margin-top:22px;width:100%;padding:14px;border:0;border-radius:6px;background:var(--orange);color:#1a1100;font:600 1rem 'Open Sans',sans-serif;cursor:pointer}
button:hover{filter:brightness(1.1)}\nbutton:disabled{opacity:.65;cursor:wait}
#msg{margin-top:16px;font-weight:600}
.err{color:#ffb4a8}.ok{color:#9dffc3}
footer{text-align:center;padding:20px;background:#031d12;color:#8fb9a3;font-size:.85rem}
</style>
</head>
<body>
<nav id="menu"></nav>
<header>
  <h1>Lojas de Limpeza</h1>
  <p>Tudo para deixar a sua casa brilhando</p>
</header>
<main id="cats"></main>

<section class="cad" id="cadastro">
  <h2>Cadastro</h2>
  <p>Preencha os dados abaixo para se cadastrar.</p>
  <form id="f">
    <label for="nome">Nome completo</label>
    <input id="nome" name="nome" autocomplete="name" placeholder="Seu nome completo" required maxlength="150">
    <label for="idade">Idade</label>
    <input id="idade" name="idade" type="number" min="1" max="120" placeholder="Ex.: 30" required>
    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" autocomplete="email" placeholder="voce@email.com" required maxlength="254">
    <label for="cpf">CPF</label>
    <input id="cpf" name="cpf" inputmode="numeric" autocomplete="off" maxlength="14" placeholder="000.000.000-00" required>
    <button type="submit" id="enviar">Cadastrar</button>
    <div id="msg" role="status" aria-live="polite"></div>
  </form>
</section>
<footer>© 2026 Lojas de Limpeza</footer>

<!-- Biblioteca oficial do Supabase para JavaScript no navegador -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/*
  Configure com a Project URL e a publishable/anon key do seu projeto.
  Nunca coloque uma secret key ou service_role key no HTML.
*/
const SUPABASE_URL = "https://egkchnytwipesylxlrfy.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_aGdGpb2JM_nVoUACK87E2Q_4eBmL6KC";

const { createClient } = window.supabase;
const supabaseClient = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

const menu = document.getElementById('menu');
const cats = document.getElementById('cats');

const slug = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, '-');

function art(cat, c) {
  const bg = '<rect width="200" height="190" fill="#e8f3ec"/>';
  if (cat === 'buchas de limpeza') {
    return `<svg viewBox="0 0 200 190" role="img" aria-label="Ilustração de bucha de limpeza">${bg}<rect x="40" y="55" width="120" height="80" rx="14" fill="${c || '#f2d230'}"/><rect x="40" y="105" width="120" height="30" rx="10" fill="#2f7d4f"/><g fill="#0003"><circle cx="70" cy="75" r="5"/><circle cx="100" cy="85" r="6"/><circle cx="130" cy="72" r="5"/><circle cx="85" cy="68" r="4"/></g></svg>`;
  }
  return `<svg viewBox="0 0 200 190" role="img" aria-label="Ilustração de frasco de limpeza">${bg}<rect x="84" y="22" width="32" height="22" rx="4" fill="#245c3d"/><rect x="72" y="42" width="56" height="12" rx="4" fill="#3a3a3a"/><rect x="58" y="54" width="84" height="116" rx="16" fill="${c || '#bfe9ff'}"/><rect x="66" y="88" width="68" height="46" rx="6" fill="#fff" opacity=".9"/><rect x="74" y="98" width="52" height="7" rx="3" fill="#06301f"/><rect x="74" y="112" width="36" height="6" rx="3" fill="#ff9d00"/></svg>`;
}

function mostrarErroProdutos(texto) {
  cats.innerHTML = `<section class="cat"><p class="err">${texto}</p></section>`;
}

// Busca categorias e produtos nas tabelas que já existem no banco.
async function carregarProdutos() {
  cats.innerHTML = '<section class="cat"><p>Carregando produtos...</p></section>';

  try {
    const [{ data: categorias, error: erroCategorias },
           { data: produtos, error: erroProdutos }] = await Promise.all([
      supabaseClient.from('categorias').select('id,nome').order('id'),
      supabaseClient.from('produtos').select('id,categoria_id,nome,preco,cor').order('id')
    ]);

    if (erroCategorias) throw erroCategorias;
    if (erroProdutos) throw erroProdutos;

    menu.replaceChildren();
    cats.replaceChildren();

    if (!categorias || categorias.length === 0) {
      mostrarErroProdutos('Nenhuma categoria foi encontrada no banco de dados.');
      return;
    }

    for (const categoria of categorias) {
      const id = slug(categoria.nome);
      const link = document.createElement('a');
      link.href = `#${id}`;
      link.textContent = categoria.nome;
      menu.appendChild(link);

      const section = document.createElement('section');
      section.className = 'cat';
      section.id = id;

      const titulo = document.createElement('h2');
      const seta = document.createElement('span');
      seta.textContent = '▸';
      titulo.append(seta, document.createTextNode(` ${categoria.nome}`));

      const grid = document.createElement('div');
      grid.className = 'grid';

      const itens = (produtos || []).filter(p => p.categoria_id === categoria.id);

      for (const produto of itens) {
        const card = document.createElement('article');
        card.className = 'prod';
        card.innerHTML = art(categoria.nome, produto.cor);

        const nome = document.createElement('h3');
        nome.textContent = produto.nome;

        const preco = document.createElement('div');
        preco.className = 'pr';
        preco.textContent = Number(produto.preco).toLocaleString('pt-BR', {
          style: 'currency',
          currency: 'BRL'
        });

        card.append(nome, preco);
        grid.appendChild(card);
      }

      if (itens.length === 0) {
        const aviso = document.createElement('p');
        aviso.textContent = 'Nenhum produto cadastrado nesta categoria.';
        grid.appendChild(aviso);
      }

      section.append(titulo, grid);
      cats.appendChild(section);
    }
  } catch (error) {
    console.error('Erro ao carregar produtos:', error);
    mostrarErroProdutos('Não foi possível carregar os produtos. Confira a URL, a chave e as permissões (RLS) do Supabase.');
  }
}

// Formata o CPF enquanto a pessoa digita.
const cpfInput = document.getElementById('cpf');
cpfInput.addEventListener('input', () => {
  let v = cpfInput.value.replace(/\D/g, '').slice(0, 11);
  if (v.length > 9) v = v.replace(/^(\d{3})(\d{3})(\d{3})(\d{1,2}).*$/, '$1.$2.$3-$4');
  else if (v.length > 6) v = v.replace(/^(\d{3})(\d{3})(\d{1,3}).*$/, '$1.$2.$3');
  else if (v.length > 3) v = v.replace(/^(\d{3})(\d{1,3}).*$/, '$1.$2');
  cpfInput.value = v;
});

function cpfOk(valor) {
  const s = valor.replace(/\D/g, '');
  if (s.length !== 11 || /^(\d)\1+$/.test(s)) return false;
  for (let t = 9; t < 11; t++) {
    let soma = 0;
    for (let i = 0; i < t; i++) soma += Number(s[i]) * (t + 1 - i);
    const digito = (soma * 10) % 11 % 10;
    if (digito !== Number(s[t])) return false;
  }
  return true;
}

// Insere na tabela public.cadastros, usando as colunas do SQL do usuário.
const form = document.getElementById('f');
const msg = document.getElementById('msg');
const enviar = document.getElementById('enviar');

form.addEventListener('submit', async (event) => {
  event.preventDefault();

  const nome = document.getElementById('nome').value.trim();
  const idade = Number(document.getElementById('idade').value);
  const email = document.getElementById('email').value.trim();
  const cpf = cpfInput.value.replace(/\D/g, '');

  const erro = texto => {
    msg.className = 'err';
    msg.textContent = texto;
  };

  if (nome.length < 3) return erro('Informe seu nome completo.');
  if (!Number.isInteger(idade) || idade < 1 || idade > 120) return erro('Informe uma idade válida.');
  if (!document.getElementById('email').checkValidity()) return erro('Informe um e-mail válido.');
  if (!cpfOk(cpf)) return erro('CPF inválido. Confira os números digitados.');

  if (SUPABASE_URL.startsWith('COLE_AQUI') || SUPABASE_PUBLISHABLE_KEY.startsWith('COLE_AQUI')) {
    return erro('Configure a URL e a chave pública do Supabase no código antes de cadastrar.');
  }

  enviar.disabled = true;
  enviar.textContent = 'Enviando...';
  msg.className = '';
  msg.textContent = 'Salvando cadastro...';

  try {
    const { error } = await supabaseClient
      .from('cadastros')
      .insert([{ nome, idade, email, cpf }]);

    if (error) {
      if (error.code === '23505') {
        throw new Error('Este e-mail ou CPF já está cadastrado.');
      }
      throw error;
    }

    msg.className = 'ok';
    msg.textContent = `Cadastro realizado com sucesso, ${nome.split(/\s+/)[0]}!`;
    form.reset();

    // Mostra uma confirmação e leva a pessoa até os produtos da loja.
    const avisoLoja = document.createElement('div');
    avisoLoja.textContent = 'Cadastro realizado com sucesso! Bem-vindo à loja.';
    Object.assign(avisoLoja.style, {
      position: 'fixed', top: '16px', left: '50%', transform: 'translateX(-50%)',
      zIndex: '9999', width: 'min(92%, 520px)', padding: '14px 18px',
      borderRadius: '8px', background: '#9dffc3', color: '#06301f',
      fontWeight: '700', textAlign: 'center', boxShadow: '0 4px 18px #0006'
    });
    document.body.appendChild(avisoLoja);
    setTimeout(() => {
      document.getElementById('cats').scrollIntoView({ behavior: 'smooth', block: 'start' });
      history.replaceState(null, '', '#cats');
    }, 900);
    setTimeout(() => avisoLoja.remove(), 5000);
  } catch (error) {
    console.error('Erro ao salvar cadastro:', error);
    msg.className = 'err';
    msg.textContent = error.message === 'Este e-mail ou CPF já está cadastrado.'
      ? error.message
      : 'Não foi possível salvar. Confira a conexão, as permissões RLS e os dados informados.';
  } finally {
    enviar.disabled = false;
    enviar.textContent = 'Cadastrar';
  }
});

carregarProdutos();
</script>
</body>
</html>
